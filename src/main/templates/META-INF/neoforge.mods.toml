modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
authors="Hgit-1,(editor：Guliac_Chenut, YU322142)"
displayURL="https://github.com/YU322142/MineAstr/tree/minecraft-neoforge-1.21.1"
displayTest="IGNORE_ALL_VERSION"
description='''
MineAstr 将服务器聊天接入 AstrBot，实现按玩家语言 AI 翻译。

仅服务端可实现转发玩家聊天、加入、离开和死亡事件的转发；智能体还可以读取服务器状态、玩家状态、背包、附近实体和已加载区域的建筑外观。

服务器命令工具默认关闭，部分命令需管理员权限。

如果玩家客户端也安装 MineAstr，可以按 F8 调整游戏翻译、告示牌/画框浮选和截图隐私；同时安装 ChatImage 后，还可自行开启或关闭 Bot 图片接收。告示牌译文会按原文指纹持久化到世界存档。

Mod 客户端可选。
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="chatimage"
    type="optional"
    versionRange="[1,)"
    ordering="AFTER"
    side="CLIENT"
